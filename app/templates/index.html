<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Free Exam Topics</title>
</head>
<body>
    <h1>Choose provider:</h1>
    <form method="POST">
        <select name="provider">
            {% for key, value in options.items() %}
                <option value="{{ key }}">{{ value }}</option>
            {% endfor %}
        </select>
        <button type="submit">Choose</button>
    </form>

    {% if selected_option %}
        <p>Selected: {{ selected_option }}</p>
    {% endif %}
</body>
</html>
