<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test Result - {{ exam_code }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/test.css') }}">
</head>
<body>
<div class="center-container">
    <div class="exam-card result-card">
        <h1>Test Completed</h1>
        <p>You answered {{ correct }} out of {{ total }} questions correctly.</p>

        <a href="{{ url_for('main.test_start', provider=provider, exam_code=exam_code) }}">Restart Test</a>
        <a href="{{ url_for('main.exam_detail', provider=provider, exam_code=exam_code) }}">Back to Exam</a>
    </div>
</div>
</body>
</html>
